<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OTAKU.ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&family=Work+Sans:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Work Sans', 'sans-serif'],
              display: ['Anton', 'sans-serif'],
              condensed: ['Oswald', 'sans-serif'],
            },
            colors: {
              'base-gray': 'var(--color-base-gray)',
              'off-black': 'var(--color-off-black)',
              'accent-red': '#D00000',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'slide-up': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'subtle-tilt': 'subtleTilt 4s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              subtleTilt: {
                '0%, 100%': { transform: 'rotate(-2deg)' },
                '50%': { transform: 'rotate(2deg)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --color-base-gray: #E5E5E5;
        --color-off-black: #0F0F0F;
      }
      .dark {
        --color-base-gray: #0F0F0F;
        --color-off-black: #E5E5E5;
      }

      /* Hide scrollbar for clean UI */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-base-gray);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-off-black);
      }
      body {
        background-color: var(--color-base-gray);
        color: var(--color-off-black);
        overflow-x: hidden;
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      /* Landing Page Title Hover Effect */
      .landing-title {
        -webkit-text-stroke: 2px var(--color-off-black);
        color: transparent;
        transition: all 0.7s ease;
      }
      .landing-title:hover {
        -webkit-text-stroke: 2px #D00000;
        transform: scale(1.05);
        transition: transform 0.3s ease-out, -webkit-text-stroke 0.3s ease-out !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
