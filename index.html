<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OTAKU.ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&family=Work+Sans:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Work Sans', 'sans-serif'],
              display: ['Anton', 'sans-serif'],
              condensed: ['Oswald', 'sans-serif'],
            },
            colors: {
              'base-gray': 'var(--color-base-gray)',
              'off-black': 'var(--color-off-black)',
              'accent-red': '#D00000',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'slide-up': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slide-in-right': 'slideInRight 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'fade-in': 'fadeIn 1s ease-out forwards',
              'scale-up': 'scaleUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'subtle-tilt': 'subtleTilt 4s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(50px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideInRight: {
                '0%': { transform: 'translateX(50px)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              scaleUp: {
                '0%': { transform: 'scale(0.9)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              subtleTilt: {
                '0%, 100%': { transform: 'rotate(-2deg)' },
                '50%': { transform: 'rotate(2deg)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --color-base-gray: #E5E5E5;
        --color-off-black: #0F0F0F;
      }
      .dark {
        --color-base-gray: #0F0F0F;
        --color-off-black: #E5E5E5;
      }

      /* Hide scrollbar for clean UI */
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      body {
        background-color: var(--color-base-gray);
        color: var(--color-off-black);
        overflow-x: hidden;
        transition: background-color 0.5s ease, color 0.5s ease;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Allow text selection where explicitly needed */
      .allow-select {
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }

      /* Landing Page Title Hover Effect */
      .landing-title {
        -webkit-text-stroke: 2px var(--color-off-black);
        color: transparent;
        transition: all 0.7s ease;
      }
      .landing-title:hover {
        -webkit-text-stroke: 2px #D00000;
        transform: scale(1.05);
        transition: transform 0.3s ease-out, -webkit-text-stroke 0.3s ease-out !important;
      }

      /* 3D Flip Animation Utilities */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
      .group:hover .group-hover\:rotate-y-180 {
        transform: rotateY(180deg);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
